[bootstrap.mise_shell_activate]
zsh = true
fish = "auto"

[bootstrap.packages]
"brew:aria2" = "latest"
"brew:atuin" = "latest"
"brew:bat" = "latest"
"brew:chezmoi" = "latest"
"brew:curl" = "latest"
"brew:fd" = "latest"
"brew:fish" = "latest"
"brew:fisher" = "latest"
"brew:git" = "latest"
"brew:mole" = "latest"
"brew:neovim" = "latest"
"brew:ripgrep" = "latest"
"brew:ruby-build" = "latest"
"brew:tree-sitter" = "latest"
"brew:tree" = "latest"
"brew:xcodesorg/made/xcodes" = "latest"
"brew:zoxide" = "latest"
"brew-cask:keepassxc" = "latest"

[bootstrap.user]
login_shell = "fish"

[dotfiles]
"~/.config/fish/config.fish/brew" = { line = "eval \"$(/opt/homebrew/bin/brew shellenv)\"" }
"~/.config/fish/config.fish/fish" = { line = "zoxide init fish --cmd cd | source" }
"~/.config/fish/config.fish/atuin" = { line = "atuin init fish --disable-up-arrow | source" }
"~/.config/fish/config.fish/jj" = { line = "mise exec -- jj util completion fish | source" }
