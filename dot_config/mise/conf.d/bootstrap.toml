[bootstrap.mise_shell_activate]
zsh = true
fish = "auto"

[bootstrap.packages]
"brew:aria2" = "latest"
"brew:bat" = "latest"
"brew:curl" = "latest"
"brew:fd" = "latest"
"brew:fish" = "latest"
"brew:fisher" = "latest"
"brew:git" = "latest"
"brew:mole" = "latest"
"brew:neovim" = "latest"
"brew:ripgrep" = "latest"
"brew:ruby-build" = "latest"
"brew:tree-sitter" = "latest"
"brew:tree" = "latest"
"brew:xcodes" = "latest"
"brew-cask:keepassxc" = "latest"

[bootstrap.hooks.post-packages]
run = "fish -c 'fisher update && set -U tide_left_prompt_items pwd vcs newline character'"

[bootstrap.user]
login_shell = "fish"
